<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0033" />
      <stop offset="100%" stop-color="#0d001a" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a2be2" />
      <stop offset="50%" stop-color="#ba55d3" />
      <stop offset="100%" stop-color="#00ffff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="50" cy="50" r="46" fill="url(#bgGrad)" stroke="#8a2be2" stroke-width="2" />

  <!-- Dracarys Flame / Dragon Emblem -->
  <g filter="url(#glow)">
    <path d="M 50 16 
             C 56 28, 66 34, 68 46 
             C 70 58, 62 70, 50 78 
             C 38 70, 30 58, 32 46 
             C 34 34, 44 28, 50 16 Z" 
          fill="url(#flameGrad)" />

    <!-- Inner Flame Core -->
    <path d="M 50 32 
             C 54 40, 60 45, 60 52 
             C 60 62, 54 68, 50 72 
             C 46 68, 40 62, 40 52 
             C 40 45, 46 40, 50 32 Z" 
          fill="#ffffff" opacity="0.9" />
  </g>
</svg>